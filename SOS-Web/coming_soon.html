<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coming Soon | SSE</title>

    <!-- existing styles if you have them -->
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="auth.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #1a001f, #000);
            color: white;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 100, 200, 0.3);
            box-shadow: 0 0 40px rgba(255, 0, 150, 0.2);
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff4fd8, #ff9a4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .status {
            font-size: 0.9rem;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        .glow-line {
            height: 2px;
            width: 80px;
            margin: 20px auto;
            background: linear-gradient(90deg, #ff4fd8, #ff9a4d);
            box-shadow: 0 0 10px rgba(255, 80, 200, 0.6);
        }

        .home-link {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            border-radius: 999px;
            background: linear-gradient(90deg, #ff4fd8, #ff9a4d);
            color: black;
            text-decoration: none;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .home-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 100, 200, 0.6);
        }
    </style>
</head>

<body>

<!-- if you have a shared header, you can include it here -->
<!-- <script src="header_auth.js"></script> -->

<div class="container">
    <div class="card">
        <div class="title">Under Construction</div>
        <div class="subtitle">
            This part of SSE is still being built.<br />
            We're shaping something powerful behind the scenes.
        </div>

        <div class="glow-line"></div>

        <div class="status">
            SSE PLATFORM · IN DEVELOPMENT
        </div>

        <a href="index.html" class="home-link">
            Return Home
        </a>
    </div>
</div>

</body>
</html>
