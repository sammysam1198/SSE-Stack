<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Contract | SpacedOut Studios</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<header class="dashboard-site-header">
    <div class="dashboard-site-header__inner">
        <nav class="dashboard-site-nav">
            <a href="/">Home</a>
            <a href="/artists">Artists</a>
            <a href="/submissions">Apply</a>
            <a href="/contact">Contact</a>
            <a href="/dashboard-artist" class="dashboard-site-nav__dashboard-link">Dashboard</a>
        </nav>

        <div class="dashboard-site-header__actions">
            <div class="artist-profile-menu" id="artist-profile-menu">
                <button
                        class="artist-profile-menu__trigger"
                        id="artist-profile-trigger"
                        type="button"
                        aria-haspopup="true"
                        aria-expanded="false"
                >
                    <img
                            src="/static/logos/sse.png"
                            alt="Profile picture"
                            class="artist-profile-menu__avatar"
                            id="artist-profile-avatar"
                    />
                </button>

                <div class="artist-profile-menu__dropdown" id="artist-profile-dropdown">
                    <div class="artist-profile-menu__section">
                        <p class="artist-profile-menu__label">Account</p>
                        <button type="button" class="artist-profile-menu__item">Edit Profile Picture</button>
                        <button type="button" class="artist-profile-menu__item">Edit Artist Page</button>
                        <button type="button" class="artist-profile-menu__item">Account Settings</button>
                    </div>

                    <div class="artist-profile-menu__section">
                        <p class="artist-profile-menu__label">Security</p>
                        <button type="button" class="artist-profile-menu__item">Change Password</button>
                        <button type="button" class="artist-profile-menu__item">Change Email</button>
                        <button type="button" class="artist-profile-menu__item">Change Username</button>
                    </div>
                </div>
            </div>

            <button class="artist-signout-button" id="artist-signout-button" type="button">
                Sign Out
            </button>
        </div>
    </div>
</header>

<main class="page-shell">
    <div class="page-shell__header">
        <p class="eyebrow">Documents</p>
        <h1>New Contract</h1>
        <p class="page-description">Create, edit, save, and send a contract.</p>
    </div>

    <form id="contract-form" class="glass-card" style="padding: 1.25rem; display:grid; gap:1rem;">
        <label>
            Artist
            <select id="contract-artist" required></select>
        </label>

        <label>
            Contract Type
            <select id="contract-type" required>
                <option value="publishing">Publishing</option>
                <option value="distribution">Distribution</option>
            </select>
        </label>

        <label>
            Recipient Emails
            <input id="contract-emails" type="text" placeholder="comma,separated@example.com" />
        </label>

        <label>
            Notes
            <input id="contract-notes" type="text" />
        </label>

        <label>
            Contract Body
            <textarea id="contract-body" rows="22" required></textarea>
        </label>

        <div style="display:flex; gap:.75rem; flex-wrap:wrap;">
            <button type="submit" id="save-draft-button" class="release-btn secondary">Save Draft</button>
            <button type="button" id="save-send-button" class="release-btn primary">Save and Send</button>
        </div>

        <div id="contract-error" style="color:#ff9fb7;"></div>
        <div id="contract-success" style="color:#9fffc8;"></div>
    </form>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/contracts/new.js"></script>
</body>
</html>
