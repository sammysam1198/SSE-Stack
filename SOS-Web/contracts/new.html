<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="SpacedOut Studios">
    <meta property="og:description" content="Your music. Your voice. Your choice.">
    <meta property="og:image" content="https://www.spacedoutstudiosent.com/static/logos/sse.png">
    <meta property="og:url" content="https://www.spacedoutstudiosent.com">
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SpacedOut Studios">
    <meta name="twitter:description" content="Your music. Your voice. Your choice.">
    <meta name="twitter:image" content="https://www.spacedoutstudiosent.com/static/logos/sse.png">
    <title>New Contract | SpacedOut Studios</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="stylesheet" href="/static/css/contracts.css" />
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<header class="dashboard-site-header">
    <div class="dashboard-site-header__inner">
        <nav class="dashboard-site-nav">
            <a href="/">Home</a>
            <a href="/dashboard-admin">Admin</a>
            <a href="/dashboard-developer">Developer</a>
            <a href="/contracts/list" class="dashboard-site-nav__dashboard-link">Documents</a>
        </nav>
    </div>
</header>

<main class="contracts-shell">
    <section class="contracts-hero">
        <p class="contracts-eyebrow">Documents</p>
        <h1>New Contract</h1>
        <p class="contracts-subtitle">
            Create, edit, save, and send publishing or distribution contracts.
        </p>
    </section>

    <section class="contracts-editor-card">
        <form id="contract-form" class="contracts-form">
            <div class="contracts-grid">
                <label>
                    <span>Artist</span>
                    <select id="contract-artist" required></select>
                </label>

                <label>
                    <span>Contract Type</span>
                    <select id="contract-type" required>
                        <option value="publishing">Publishing</option>
                        <option value="distribution">Distribution</option>
                    </select>
                </label>

                <label class="contracts-grid__full">
                    <span>Recipient Emails</span>
                    <input id="contract-emails" type="text" placeholder="comma,separated@example.com" />
                </label>

                <label class="contracts-grid__full">
                    <span>Notes</span>
                    <input id="contract-notes" type="text" placeholder="Optional internal notes" />
                </label>

                <label class="contracts-grid__full">
                    <span>Contract Body</span>
                    <textarea id="contract-body" rows="24" required></textarea>
                </label>
            </div>

            <div class="contracts-actions">
                <button type="submit" id="save-draft-button" class="release-btn secondary">
                    Save Draft
                </button>

                <button type="button" id="save-send-button" class="release-btn primary">
                    Save and Send
                </button>
            </div>

            <div id="contract-error" class="contracts-error"></div>
            <div id="contract-success" class="contracts-success"></div>
        </form>
    </section>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/contracts/new.js"></script>
</body>
</html>
