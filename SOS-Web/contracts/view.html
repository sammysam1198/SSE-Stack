<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>View Contract | SpacedOut Studios</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="stylesheet" href="/static/css/contracts.css" />
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<header class="dashboard-site-header">
    <div class="dashboard-site-header__inner">
        <nav class="dashboard-site-nav">
            <a href="/">Home</a>
            <a href="/dashboard-admin">Admin</a>
            <a href="/dashboard-developer">Developer</a>
            <a href="/contracts/list" class="dashboard-site-nav__dashboard-link">Documents</a>
        </nav>
    </div>
</header>

<main class="contracts-shell">
    <section class="contracts-hero">
        <p class="contracts-eyebrow">Documents</p>
        <h1 id="contract-title">Contract</h1>
        <p class="contracts-subtitle" id="contract-meta">Loading...</p>
    </section>

    <section class="contracts-view-card" style="display:grid; gap:1rem;">
        <div class="contracts-meta-row" id="contract-status-line"></div>

        <div class="contracts-actions">
            <a id="download-unsigned-docx" class="release-btn secondary" href="#">Download DOCX</a>
            <a id="download-unsigned-pdf" class="release-btn secondary" href="#">Download PDF</a>
            <a id="download-signed-pdf" class="release-btn secondary" href="#" style="display:none;">Download Signed</a>
        </div>

        <div>
            <h3 style="margin:0 0 .6rem 0;">Recipients</h3>
            <div id="contract-recipients" class="contracts-recipient-list"></div>
        </div>

        <div>
            <h3 style="margin:0 0 .6rem 0;">Contract Body</h3>
            <div id="contract-body" class="contracts-body-block"></div>
        </div>

        <div>
            <h3 style="margin:0 0 .6rem 0;">Upload Signed Contract</h3>

            <label style="display:grid; gap:.45rem;">
                <span>Signed PDF</span>
                <input type="file" id="signed-contract-file" accept=".pdf,application/pdf" />
            </label>

            <div class="contracts-actions" style="margin-top:.9rem;">
                <button type="button" id="upload-signed-button" class="release-btn primary">
                    Upload Signed Contract
                </button>
            </div>
        </div>

        <div id="contract-error" class="contracts-error"></div>
        <div id="contract-success" class="contracts-success"></div>
    </section>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/contracts/view.js"></script>
</body>
</html>
