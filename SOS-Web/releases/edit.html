<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Release | SpacedOut Studios</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link rel="stylesheet" href="/static/css/dashboard.css" />
    <link rel="stylesheet" href="/static/css/releases/common.css" />
    <link rel="stylesheet" href="/static/css/releases/edit.css" />
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<header class="dashboard-site-header">
    <div class="dashboard-site-header__inner">
        <nav class="dashboard-site-nav">
            <a href="/">Home</a>
            <a href="/artists">Artists</a>
            <a href="/submissions">Apply</a>
            <a href="/contact">Contact</a>
            <a href="/dashboard-artist" class="dashboard-site-nav__dashboard-link">Dashboard</a>
        </nav>

        <div class="dashboard-site-header__actions">
            <div class="artist-profile-menu" id="artist-profile-menu">
                <button
                        class="artist-profile-menu__trigger"
                        id="artist-profile-trigger"
                        type="button"
                        aria-haspopup="true"
                        aria-expanded="false"
                >
                    <img
                            src="/static/logos/sse.png"
                            alt="Profile picture"
                            class="artist-profile-menu__avatar"
                            id="artist-profile-avatar"
                    />
                </button>

                <div class="artist-profile-menu__dropdown" id="artist-profile-dropdown">
                    <div class="artist-profile-menu__section">
                        <p class="artist-profile-menu__label">Account</p>
                        <button type="button" class="artist-profile-menu__item">Edit Profile Picture</button>
                        <button type="button" class="artist-profile-menu__item">Edit Artist Page</button>
                        <button type="button" class="artist-profile-menu__item">Account Settings</button>
                    </div>

                    <div class="artist-profile-menu__section">
                        <p class="artist-profile-menu__label">Security</p>
                        <button type="button" class="artist-profile-menu__item">Change Password</button>
                        <button type="button" class="artist-profile-menu__item">Change Email</button>
                        <button type="button" class="artist-profile-menu__item">Change Username</button>
                    </div>
                </div>
            </div>

            <button class="artist-signout-button" id="artist-signout-button" type="button">
                Sign Out
            </button>
        </div>
    </div>
</header>

<main class="page-shell">
    <div class="page-shell__header">
        <p class="eyebrow">Release Intake</p>
        <h1 id="release-page-title">Edit Release</h1>
        <p class="page-description">Update your draft before submitting it for review.</p>
    </div>

    <div id="release-error" role="alert"></div>
    <div id="release-success" role="status"></div>

    <form id="release-form" novalidate>
        <label>
            Release Title
            <input type="text" name="release_title" required />
        </label>

        <label>
            Release Type
            <select name="release_type" required>
                <option value="">Select one</option>
                <option value="single">Single</option>
                <option value="ep">EP</option>
                <option value="album">Album</option>
            </select>
        </label>

        <label>
            Language
            <input type="text" name="language" placeholder="English, Spanish, Instrumental, etc." />
        </label>

        <label>
            Preferred Release Date
            <input type="date" name="preferred_release_date" />
        </label>

        <label>
            Genre Notes
            <textarea name="genre_notes" placeholder="If more than one genre applies, note it here."></textarea>
        </label>

        <label>
            Pitch
            <textarea name="pitch" placeholder="What is the song or release about? Why was it made? Any notable features or producer notes?"></textarea>
        </label>

        <label>
            Lyrics
            <textarea name="lyrics" placeholder="Paste lyrics here, or write Instrumental if there are no lyrics."></textarea>
        </label>

        <div class="form-actions">
            <button type="submit">Save Draft</button>
        </div>
    </form>
</main>

<div class="signin-modal" id="signin-modal" aria-hidden="true">
    <div class="signin-panel">
        <h2>Sign In</h2>
        <p>Access your Spaced Out Studios account.</p>

        <form class="signin-form" id="signin-form">
            <label>
                Email
                <input type="email" name="email" required />
            </label>

            <label>
                Password
                <input type="password" name="password" required />
            </label>

            <div class="signin-error" id="signin-error"></div>

            <div class="signin-actions">
                <button class="signin-cancel" type="button" data-close-signin>Cancel</button>
                <button class="signin-submit" type="submit">Sign In</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/header_auth.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/releases/common.js"></script>
<script src="/static/js/releases/edit.js"></script>
</body>
</html>
