<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Release | SpacedOut Studios</title>

    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/header.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
    <link rel="stylesheet" href="/static/css/releases/common.css" />
    <link rel="stylesheet" href="/static/css/releases/new.css" />
    <link rel="icon" type="image/png" href="/favicon.png">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="/">
            <span class="brand-orb"></span>
            <span class="brand-text">SpacedOut Studios</span>
        </a>

        <nav class="site-nav">
            <a href="/">Home</a>
            <a href="/coming_soon">About</a>
            <a href="/artists">Artists</a>
            <a href="/submissions">Apply</a>
            <a href="/coming_soon">Contact</a>
        </nav>

        <div id="auth-slot"></div>
    </div>
</header>

<main class="page-shell">
    <div class="page-shell__header">
        <p class="eyebrow">Releases</p>
        <h1 id="release-page-title">New Release</h1>
        <p id="artist-context"></p>
    </div>

    <div id="release-error" role="alert"></div>
    <div id="release-success" role="status"></div>

    <form id="release-form" novalidate>
        <section class="release-section">
            <h2>Basic Info</h2>

            <label>
                Release Title
                <input type="text" name="release_title" required />
            </label>

            <label>
                Release Type
                <select name="release_type" required>
                    <option value="">Select one</option>
                    <option value="single">Single</option>
                    <option value="ep">EP</option>
                    <option value="album">Album</option>
                </select>
            </label>

            <label>
                Preferred Release Date
                <input type="date" name="preferred_release_date" />
            </label>

            <label>
                Primary Genre
                <input type="text" name="primary_genre" placeholder="Synthwave, House, Trance, etc." />
            </label>

            <label>
                Other Genres
                <textarea name="other_genres" placeholder="If other genres apply, explain them here."></textarea>
            </label>

            <label>
                Release Pitch
                <textarea name="release_pitch" placeholder="What is this release about? What makes it special?"></textarea>
            </label>
        </section>

        <section class="release-section">
            <div class="section-row">
                <h2>Artists</h2>
                <button type="button" id="add-artist-button">+ Add Artist</button>
            </div>

            <div id="artists-container"></div>
        </section>

        <div class="form-actions">
            <button type="submit">Create Release Draft</button>
        </div>
    </form>
</main>

<div class="signin-modal" id="signin-modal" aria-hidden="true">
    <div class="signin-panel">
        <h2>Sign In</h2>
        <p>Access your Spaced Out Studios account.</p>

        <form class="signin-form" id="signin-form">
            <label>
                Email
                <input type="email" name="email" required />
            </label>

            <label>
                Password
                <input type="password" name="password" required />
            </label>

            <div class="signin-error" id="signin-error"></div>

            <div class="signin-actions">
                <button class="signin-cancel" type="button" data-close-signin>Cancel</button>
                <button class="signin-submit" type="submit">Sign In</button>
            </div>
        </form>
    </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/header_auth.js"></script>
<script src="/static/js/releases/common.js"></script>
<script src="/static/js/releases/new.js"></script>
</body>
</html>
