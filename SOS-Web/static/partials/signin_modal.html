<div class="signin-modal" id="signin-modal" aria-hidden="true">
    <div class="signin-panel">
        <h2>Sign In</h2>
        <p>Access your SpacedOut Studios account.</p>

        <form class="signin-form" id="signin-form" method="post" action="javascript:void(0);">
            <label for="signin-email">
                Email
                <input
                        id="signin-email"
                        type="email"
                        name="email"
                        autocomplete="username"
                        inputmode="email"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                />
            </label>

            <label for="signin-password">
                Password
                <div class="password-field-wrap">
                    <input
                            id="signin-password"
                            type="password"
                            name="password"
                            autocomplete="current-password"
                            autocapitalize="none"
                            spellcheck="false"
                            required
                    />
                    <button
                            id="signin-password-toggle"
                            class="password-toggle"
                            type="button"
                            aria-label="Show password"
                    >
                        <img
                                id="signin-password-toggle-icon"
                                src="/static/assets/show_password.png"
                                alt=""
                        />
                    </button>
                </div>
            </label>

            <div class="signin-error" id="signin-error"></div>

            <div class="signin-actions">
                <button class="signin-cancel" type="button" data-close-signin>Cancel</button>
                <button class="signin-submit" type="submit">Sign In</button>
            </div>
        </form>
    </div>
</div>
