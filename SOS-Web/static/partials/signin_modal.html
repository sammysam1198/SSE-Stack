<div class="signin-modal" id="signin-modal" aria-hidden="true">
    <div class="signin-panel">
        <h2>Sign In</h2>
        <p>Access your SpacedOut Studios account.</p>

        <form class="signin-form" id="signin-form" method="post" action="javascript:void(0);">
            <label>
                Email
                <input id="signin-email" name="email" type="email" autocomplete="username">
            </label>

            <label>
                Password
                <div class="password-field-wrap">
                    <input id="signin-password" name="password" type="password" autocomplete="current-password">
                    <button type="button" class="password-toggle" id="signin-password-toggle" aria-label="Show password">
                        <img src="/static/assets/hide_password.png" alt="" id="signin-password-toggle-icon" />
                    </button>
                </div>
            </label>

            <div class="signin-error" id="signin-error"></div>

            <div class="signin-actions">
                <button class="signin-cancel" type="button" data-close-signin>Cancel</button>
                <button class="signin-submit" type="submit">Sign In</button>
            </div>
        </form>
    </div>
</div>
